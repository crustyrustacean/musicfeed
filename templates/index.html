<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      type="text/css"
      href="/static/screen.css"
      media="screen"
    />
    <title>MusicFeed</title>
  </head>
  <body>
    <header>
      <h1>MusicFeed</h1>
    </header>

    <main>
      <form id="rotation-form" data-on:submit__prevent="@post('/rotation')">
        <div class="field">
          <label for="artist">Artist</label>
          <input id="artist" type="text" data-bind:artist required autofocus />
        </div>

        <div class="field">
          <label for="album">Album</label>
          <input id="album" type="text" data-bind:album required />
        </div>

        <div class="field field-full">
          <label for="note">Note</label>
          <input id="note" type="text" data-bind:note />
        </div>

        <button type="submit" class="submit">Add to rotation</button>
      </form>

      <!-- Populated only when a lookup fails. The entry is still saved; this
           just says why it arrived without a cover. -->
      <p id="metadata-status" class="metadata-status" data-text="$metadata_status"></p>

      <ul id="rotation-list">
        {% for rotation_entry in rotation_entries %}{% include "rotation.html" %}{% endfor %}
        <!--
        The empty-state message lives INSIDE the list so that the append patch targets
        the same element every time. Its id is part of the stream contract: the handler
        removes `#rotation-loading` whenever it appends an entry, so this node cannot
        survive as stale text below the list. The blog's loading notice uses the same
        id, which is why the removal is addressed by id rather than by class.
        -->
        <li id="rotation-loading" class="rotation-empty" {% if rotation_entries | length > 0 %}hidden{% endif %}>
          Nothing spinning yet. Add the first entry above.
        </li>
      </ul>
    </main>

    <script type="module" src="/static/datastar.js"></script>
  </body>
</html>
